services:
  - type: web
    name: caelhub-matrix
    runtime: python
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_DESTINATION_EMAIL
        value: caelhub@gmail.com
      - key: GROQ_API_KEY
        sync: false

